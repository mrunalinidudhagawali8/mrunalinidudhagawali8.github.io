<h1>URL Shortener</h1>

<form id="shorten-form">
    <input type="text" id="original-url" placeholder="Enter original URL" required />
    <button type="submit">Shorten</button>
</form>

<div id="result" style="margin-top: 20px;"></div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("shorten-form");
      const result = document.getElementById("result");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const url = document.getElementById("original-url").value;
        result.innerHTML = "Processing...";

        try {
          const res = await fetch("https://url-shortener-api-production-ec50.up.railway.app/api/shorten", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ originalUrl: url })
          });

          const shortCode = await res.text();

          const fullShortUrl = `https://url-shortener-api-production-ec50.up.railway.app/api/${shortCode}`;
          result.innerHTML = `
            <p><strong>Shortened URL:</strong> <a href="${fullShortUrl}" target="_blank">${fullShortUrl}</a></p>
          `;
        } catch (error) {
          console.error(error);
          result.innerHTML = `<p style="color: red;">Failed to shorten the URL. Please try again.</p>`;
        }
      });
    });
</script>
