<div style="max-width: 600px; margin: 0 auto; padding-top: 60px; text-align: center;">
    <h1 style="color: #8cff00;">URL Shortener</h1>

    <form id="shorten-form" style="margin-top: 20px;">
        <input type="text" id="original-url" placeholder="Enter original URL" required
               style="padding: 10px; width: 70%; border: none; background-color: #111; color: #8cff00; font-family: monospace;" />
        <button type="submit"
                style="padding: 10px 20px; background-color: #8cff00; color: black; border: none; font-weight: bold; cursor: pointer;">
            Shorten
        </button>
    </form>

    <div id="result" style="margin-top: 30px; font-family: monospace;"></div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("shorten-form");
      const result = document.getElementById("result");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const url = document.getElementById("original-url").value;
        result.innerHTML = "Processing...";

        try {
          const res = await fetch("https://url-shortener-api-production-ec50.up.railway.app/api/shorten", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ originalUrl: url })
          });

          const shortCode = await res.text();
          const fullShortUrl = `https://url-shortener-api-production-ec50.up.railway.app/api/${shortCode}`;

          result.innerHTML = `
            <p><strong>Shortened URL:</strong> <a href="${fullShortUrl}" target="_blank" style="color: #00b7ff;">${fullShortUrl}</a></p>
          `;
        } catch (error) {
          console.error(error);
          result.innerHTML = `<p style="color: red;">Failed to shorten the URL. Please try again.</p>`;
        }
      });
    });
</script>
