<h1>URL Shortener</h1>
<form id="shorten-form">
    <input type="text" id="original-url" placeholder="Enter original URL" required />
    <button type="submit">Shorten</button>
</form>
<p id="result"></p>

<script>
    const form = document.getElementById('shorten-form');
    const result = document.getElementById('result');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const url = document.getElementById('original-url').value;

      const res = await fetch('https://url-shortener-api-production-ec50.up.railway.app/api/shorten', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ originalUrl: url })
      });

      const shortCode = await res.text(); // get short code like "NKX3Rd"
      const fullShortUrl = `https://url-shortener-api-production-ec50.up.railway.app/api/${shortCode}`;

      result.innerHTML = `Shortened URL: <a href="${fullShortUrl}" target="_blank">${fullShortUrl}</a>`;
    });
</script>
